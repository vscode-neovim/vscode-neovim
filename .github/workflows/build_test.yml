name: Code Check & Test

on: [pull_request, push]

permissions:
    contents: read

jobs:
    build:
        name: Build & Test (${{ matrix.os }}, nvim ${{ matrix.neovim-version }})
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
                neovim-version: [stable, nightly]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: "npm"

            - name: Install Neovim
              uses: rhysd/action-setup-vim@v1
              id: vim
              with:
                  neovim: true
                  version: ${{ matrix.neovim-version }}
            - name: npm install
              run: npm ci --silent

            - name: Build
              run: npm run test-compile

            - name: Webpack
              # On Linux, test the production bundle (what `vsce package` publishes to the marketplace).
              run: npx webpack --mode ${{ matrix.os == 'ubuntu-latest' && 'production' || 'development' }}

            - name: Test
              uses: coactions/setup-xvfb@v1
              env:
                  NEOVIM_PATH: ${{ steps.vim.outputs.executable }}
                  NEOVIM_DEBUG: 1
                  NEOVIM_DEBUG_HOST: 127.0.0.1
                  NEOVIM_DEBUG_PORT: 4000
                  DBUS_SESSION_BUS_ADDRESS: ""
              with:
                  run: npm run test
    create:
        name: Create extension
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: "npm"
            - name: npm install
              run: npm ci --silent
            - name: Create extension
              run: npx vsce package -o vscode-neovim-${{github.sha}}.vsix
            - name: Upload extension
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v7
              with:
                  name: vscode-neovim
                  path: vscode-neovim-${{github.sha}}.vsix
