name: Conventional Commits

on:
    pull_request:
        branches: [master]

permissions:
    contents: read
    # webiny/action-conventional-commits reads the PR's commits.
    pull-requests: read

jobs:
    build:
        name: Conventional Commits
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: webiny/action-conventional-commits@v1.4.2
