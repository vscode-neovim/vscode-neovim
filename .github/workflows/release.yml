name: Release

on:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    release-please:
        name: release-please
        runs-on: ubuntu-latest
        permissions:
            # Create the release commit, tag and GitHub release, and open the release PR.
            contents: write
            pull-requests: write
        steps:
            # Configured by release-please-config.json: setting `release-type` here would
            # switch the action to its no-config mode and ignore that file.
            - uses: googleapis/release-please-action@v5
              id: release
            - uses: actions/checkout@v7
              if: ${{ steps.release.outputs.release_created }}
            - uses: actions/setup-node@v7
              if: ${{ steps.release.outputs.release_created }}
              with:
                  node-version-file: package.json
                  cache: "npm"
            - name: npm install
              if: ${{ steps.release.outputs.release_created }}
              run: npm ci --silent
            - name: vsce package
              if: ${{ steps.release.outputs.release_created }}
              run: npx vsce package -o vscode-neovim-${{steps.release.outputs.tag_name}}.vsix
            - name: Upload Release Artifact
              if: ${{ steps.release.outputs.release_created }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run:
                  gh release upload ${{ steps.release.outputs.tag_name }} vscode-neovim-${{
                  steps.release.outputs.tag_name }}.vsix
            - name: vsce publish
              if: ${{ steps.release.outputs.release_created }}
              env:
                  VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
              run: npx vsce publish
